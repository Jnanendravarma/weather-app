<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherSphere - System Status</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .status-item {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #4CAF50;
        }
        .status-fail {
            border-left-color: #f44336;
        }
        .test-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }
        .test-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        #results {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            min-height: 100px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌦️ WeatherSphere System Status</h1>
        
        <div class="status-item">
            <h3>✅ Frontend Server</h3>
            <p>Status: <span id="frontend-status">Running on http://localhost:8080</span></p>
        </div>
        
        <div class="status-item" id="backend-status-item">
            <h3>🔧 Backend Server</h3>
            <p>Status: <span id="backend-status">Checking...</span></p>
        </div>
        
        <div class="status-item" id="api-status-item">
            <h3>🌍 Weather API</h3>
            <p>Status: <span id="api-status">Checking...</span></p>
        </div>
        
        <h2>🧪 Test Functions</h2>
        <button class="test-btn" onclick="testBackendHealth()">Test Backend Health</button>
        <button class="test-btn" onclick="testWeatherAPI()">Test Weather API</button>
        <button class="test-btn" onclick="testForecastAPI()">Test Forecast API</button>
        <button class="test-btn" onclick="openMainApp()">Open Main App</button>
        
        <div id="results"></div>
    </div>

    <script>
        const results = document.getElementById('results');
        
        function log(message) {
            results.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            results.scrollTop = results.scrollHeight;
        }
        
        async function testBackendHealth() {
            log('Testing backend health...');
            try {
                const response = await fetch('http://localhost:5000/api/health');
                const data = await response.json();
                log('✅ Backend Health: ' + JSON.stringify(data, null, 2));
                document.getElementById('backend-status').textContent = 'Running ✅';
                document.getElementById('backend-status-item').className = 'status-item';
            } catch (error) {
                log('❌ Backend Health Error: ' + error.message);
                document.getElementById('backend-status').textContent = 'Failed ❌';
                document.getElementById('backend-status-item').className = 'status-item status-fail';
            }
        }
        
        async function testWeatherAPI() {
            log('Testing weather API with London...');
            try {
                const response = await fetch('http://localhost:5000/api/weather?city=London');
                const data = await response.json();
                log('✅ Weather API Response: ' + JSON.stringify({
                    city: data.name,
                    country: data.sys?.country,
                    temperature: data.main?.temp + '°C',
                    description: data.weather?.[0]?.description
                }, null, 2));
                document.getElementById('api-status').textContent = 'Working ✅';
                document.getElementById('api-status-item').className = 'status-item';
            } catch (error) {
                log('❌ Weather API Error: ' + error.message);
                document.getElementById('api-status').textContent = 'Failed ❌';
                document.getElementById('api-status-item').className = 'status-item status-fail';
            }
        }
        
        async function testForecastAPI() {
            log('Testing forecast API with Mumbai...');
            try {
                const response = await fetch('http://localhost:5000/api/forecast?city=Mumbai');
                const data = await response.json();
                log('✅ Forecast API Response: ' + data.list?.length + ' forecast entries received');
            } catch (error) {
                log('❌ Forecast API Error: ' + error.message);
            }
        }
        
        function openMainApp() {
            window.open('/', '_blank');
        }
        
        // Auto-test on load
        window.onload = () => {
            log('🚀 WeatherSphere System Status Check Started');
            testBackendHealth();
            setTimeout(testWeatherAPI, 1000);
        };
    </script>
</body>
</html>
