<!-- SVG Weather Icons -->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <!-- Sun Icon -->
    <symbol id="sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5" fill="currentColor"/>
        <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
        <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"/>
        <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/>
        <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2"/>
    </symbol>
    
    <!-- Cloud Icon -->
    <symbol id="cloud" viewBox="0 0 24 24">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="currentColor"/>
    </symbol>
    
    <!-- Rain Icon -->
    <symbol id="rain" viewBox="0 0 24 24">
        <line x1="16" y1="13" x2="16" y2="21" stroke="currentColor" stroke-width="2"/>
        <line x1="8" y1="13" x2="8" y2="21" stroke="currentColor" stroke-width="2"/>
        <line x1="12" y1="15" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>
        <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    
    <!-- Snow Icon -->
    <symbol id="snow" viewBox="0 0 24 24">
        <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="8" y1="16" x2="8.01" y2="16" stroke="currentColor" stroke-width="2"/>
        <line x1="8" y1="20" x2="8.01" y2="20" stroke="currentColor" stroke-width="2"/>
        <line x1="12" y1="18" x2="12.01" y2="18" stroke="currentColor" stroke-width="2"/>
        <line x1="12" y1="22" x2="12.01" y2="22" stroke="currentColor" stroke-width="2"/>
        <line x1="16" y1="16" x2="16.01" y2="16" stroke="currentColor" stroke-width="2"/>
        <line x1="16" y1="20" x2="16.01" y2="20" stroke="currentColor" stroke-width="2"/>
    </symbol>
    
    <!-- Thunderstorm Icon -->
    <symbol id="thunder" viewBox="0 0 24 24">
        <path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9" fill="none" stroke="currentColor" stroke-width="2"/>
        <polyline points="13 11 9 17 11 17 7 23" stroke="currentColor" stroke-width="2"/>
    </symbol>
    
    <!-- Wind Icon -->
    <symbol id="wind" viewBox="0 0 24 24">
        <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2" stroke="currentColor" stroke-width="2"/>
        <path d="M9.6 4.6A2 2 0 1 1 11 8H2" stroke="currentColor" stroke-width="2"/>
        <path d="M12.6 19.4A2 2 0 1 0 14 16H2" stroke="currentColor" stroke-width="2"/>
    </symbol>
    
    <!-- Mist/Fog Icon -->
    <symbol id="mist" viewBox="0 0 24 24">
        <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"/>
        <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2"/>
        <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2"/>
    </symbol>
</svg>